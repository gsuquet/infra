---
# Static checks of every pull request and push to main. OpenTofu plan stays
# local, and the kind end-to-end job is deferred. Tools come from
# .mise/config.toml and .mise/mise.lock, the same versions as on a laptop.
name: Checks

on:
  pull_request:
  # And main, GitOps job only: a squash merge can break the rendered
  # manifests while every pull request was green.
  push:
    branches: [main]

permissions: {}

concurrency:
  # Pull requests: one group per PR, superseded runs cancelled.
  # Main: one group per commit, so every commit gets a full run.
  group: >-
    checks-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit hooks
    # Pull requests only: the hooks already gate every change before merge.
    # Native CI checks will replace this job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Run pre-commit on all files
        env:
          # tflint --init downloads its plugins from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: pre-commit run --all-files --show-diff-on-failure

  gitops:
    name: GitOps tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: >-
            actionlint conftest helm jsonschema kubeconform shellcheck shfmt
            yq zizmor

      - name: Lint task scripts
        run: mise run lint:shell

      - name: Lint workflows
        run: mise run lint:actions

      - name: Check schemas and GitOps files
        run: mise run schemas:check

      - name: Test policies
        run: mise run policy:test

      - name: Check rendered manifests are up to date
        run: mise run manifests:check

      - name: Validate rendered manifests
        run: mise run manifests:validate

      - name: Check rendered manifests against policies
        run: mise run policy:check
