repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: pretty-format-json
        args:
          - --autofix

  - repo: https://github.com/betterleaks/betterleaks
    rev: b4b1c4455987636400ce693bd9d8a8e2cf375ed9  # frozen: v2.0.0-rc8
    hooks:
      - id: betterleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        exclude: '/sources/templates/'

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6f9f6fb27042eeb2c12163c94cf22289e9710eda  # frozen: 44.239.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: b9e409b0fee34ee0eee7e6f6a407061f15032926  # frozen: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_providers_lock
      - id: terraform_tflint
      - id: terraform_trivy
      - id: terraform_validate
      - id: tfupdate
