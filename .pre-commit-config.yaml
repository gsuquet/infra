default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: pretty-format-json
        args:
          - --autofix

  - repo: https://github.com/betterleaks/betterleaks
    rev: b4b1c4455987636400ce693bd9d8a8e2cf375ed9  # frozen: v2.0.0-rc8
    hooks:
      - id: betterleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Same as the hook's manifest. Stated here so that Renovate's
        # pre-commit manager tracks additional_dependencies.
        language: node
        # Unpinned, nodeenv resolves "latest" to the first entry of the
        # nodejs.org index, now a 27.0.0 alpha it cannot parse. Exact LTS pin
        # (commitlint 21 needs node >=22.12), updated by Renovate.
        # renovate: datasource=node-version depName=node
        language_version: 26.13.1
        # The hook's own commitlint --edit always reads .git/COMMIT_EDITMSG,
        # but git passes other files (MERGE_MSG on git merge). Lint the file
        # git passes.
        pass_filenames: true
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        # Helm templates are not YAML until rendered. Rendered manifests are
        # generated (manifests:check, kubeconform and conftest cover them).
        exclude: |
          (?x)(
            /sources/templates/|
            ^testdata/charts/[^/]+/templates/|
            /rendered/
          )

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6f9f6fb27042eeb2c12163c94cf22289e9710eda  # frozen: 44.239.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: b9e409b0fee34ee0eee7e6f6a407061f15032926  # frozen: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_providers_lock
        # Lock files hash every platform that runs Terraform: macOS laptops,
        # CI runners and arm64 Linux. The hook only regenerates a lock file
        # when a platform is missing, so CI does not rewrite it.
        args:
          - --hook-config=--mode=regenerate-lockfile-if-some-platform-missed
          - --args=-platform=darwin_arm64
          - --args=-platform=linux_amd64
          - --args=-platform=linux_arm64
      - id: terraform_tflint
      - id: terraform_trivy
      - id: terraform_validate
      - id: tfupdate
