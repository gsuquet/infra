# cilium 1.20.5, kube-proxy replacement on kind.
---
kubeProxyReplacement: true
k8sServiceHost: exp-default-deny-control-plane
k8sServicePort: 6443
ipam:
  mode: kubernetes
operator:
  replicas: 1
# Default mode: only endpoints selected by a policy are in default-deny.
policyEnforcementMode: default
hubble:
  enabled: true
  relay:
    enabled: false
  ui:
    enabled: false
