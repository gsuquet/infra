# Every namespace except kube-system and the unlabelled test fixture carries the
# policy label (platform namespaces included).
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    infra.gsuquet.com/network-policy: default-deny
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    infra.gsuquet.com/network-policy: default-deny
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    infra.gsuquet.com/network-policy: default-deny
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    infra.gsuquet.com/network-policy: default-deny
    infra.gsuquet.com/role: gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    infra.gsuquet.com/network-policy: default-deny
    infra.gsuquet.com/role: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    infra.gsuquet.com/network-policy: default-deny
    infra.gsuquet.com/tenant: tenant-a
    # Host-network, hostPort and privileged pods escape Cilium policy:
    # tenants get Pod Security Admission baseline (rejects all three).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels:
    infra.gsuquet.com/network-policy: default-deny
    infra.gsuquet.com/tenant: tenant-b
    # Host-network, hostPort and privileged pods escape Cilium policy:
    # tenants get Pod Security Admission baseline (rejects all three).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
---
# Test-only Helm repository for the AppProject check; deliberately unlabelled.
apiVersion: v1
kind: Namespace
metadata:
  name: exp-fixtures
