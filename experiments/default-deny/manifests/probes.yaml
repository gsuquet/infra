# Cilium namespace-label keys and digest-pinned images exceed 80 columns.
# yamllint disable rule:line-length
# agnhost probe pods: a tenant server, clients, a fake gateway and a fake
# scraper.
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: tenant-a
  labels:
    app: server
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      args:
        - netexec
        - --http-port=8080
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: tenant-a
spec:
  selector:
    app: server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: tenant-a
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      args:
        - pause
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: tenant-b
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      args:
        - pause
---
apiVersion: v1
kind: Pod
metadata:
  name: proxy
  namespace: gateway
  labels:
    app: gateway-sim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      args:
        - pause
---
apiVersion: v1
kind: Pod
metadata:
  name: scraper
  namespace: monitoring
  labels:
    app: scraper
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      args:
        - pause
