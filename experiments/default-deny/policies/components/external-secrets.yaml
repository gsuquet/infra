# Cilium namespace-label keys and digest-pinned images exceed 80 columns.
# yamllint disable rule:line-length
# Component layer: external-secrets (namespace external-secrets).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  description: kube-apiserver calls the admission webhook (Service 443 -> pod 10250).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-metrics
  namespace: external-secrets
spec:
  description: Metrics scraped from monitoring namespaces.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.infra.gsuquet.com/role: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
# Provider egress is backend-specific and added once the secrets backend study
# settles, e.g. toFQDNs secretmanager.googleapis.com:443 for GCP Secret Manager.
# The kind store (fake provider) needs no egress at all.
