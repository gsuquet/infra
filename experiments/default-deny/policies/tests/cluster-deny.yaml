# Cilium namespace-label keys and digest-pinned images exceed 80 columns.
# yamllint disable rule:line-length
# Deny rules win over any allow, tenant CNPs included. 1.0.0.1 stands in for a
# real target such as the cloud metadata endpoint 169.254.169.254/32.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-egress-deny
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.infra.gsuquet.com/network-policy: default-deny
  # Only adds denies; must not change the default mode of the selected pods.
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
    - toCIDR:
        - 1.0.0.1/32
