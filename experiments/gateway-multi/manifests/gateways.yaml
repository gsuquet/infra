---
# One Gateway + HTTPRoute per implementation, same backend, different hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-cilium
  namespace: demo
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-cilium
  namespace: demo
spec:
  parentRefs:
    - name: gw-cilium
  hostnames: ["cilium.example.test"]
  rules:
    - backendRefs:
        - name: echo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-agentgateway
  namespace: demo
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-agentgateway
  namespace: demo
spec:
  parentRefs:
    - name: gw-agentgateway
  hostnames: ["agentgateway.example.test"]
  rules:
    - backendRefs:
        - name: echo
          port: 8080
